<!-- ============================================================
  TOGİ – PWA için mevcut index.html'ine eklenecek 4 parça
  Dosyalar index.html ile AYNI klasörde olmalı:
  index.html, manifest.json, service-worker.js, icon-192.png, icon-512.png
============================================================ -->


<!-- ───────── 1) <head> içine (</head> satırının hemen üstüne) ───────── -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<!-- Sayfanda zaten bir <meta name="theme-color"> var: yeni satır ekleme, mevcut olanın content değerini #071722 yap:
     <meta name="theme-color" content="#071722"> -->


<!-- ───────── 2) <head> içindeki <style>
.togi-pwa{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 12px;
  background:#071722;color:#fff;border-bottom:1px solid rgba(255,255,255,.12);
  box-shadow:0 8px 22px -14px rgba(0,0,0,.6);font-size:13px;line-height:1.35;font-family:inherit;
  animation:tpIn .35s ease-out}
.togi-pwa[hidden]{display:none}
.togi-pwa .tp-ico{width:40px;height:40px;border-radius:10px;flex:none;object-fit:cover}
.togi-pwa .tp-txt{flex:1;min-width:0}
.togi-pwa .tp-txt b{display:block;font-size:14px;font-weight:700}
.togi-pwa .tp-txt span{display:block;color:rgba(255,255,255,.74)}
.togi-pwa .tp-sh{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin:0 1px;color:#8fb4ff}
.togi-pwa .tp-btn{flex:none;background:#fff;color:#071722;border:0;border-radius:10px;
  padding:9px 16px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer}
.togi-pwa .tp-btn[hidden]{display:none}
.togi-pwa .tp-x{flex:none;width:36px;height:36px;display:grid;place-items:center;background:none;border:0;
  border-radius:50%;color:rgba(255,255,255,.75);font-size:18px;line-height:1;cursor:pointer}
.togi-pwa .tp-btn:focus-visible,.togi-pwa .tp-x:focus-visible{outline:3px solid #fff;outline-offset:2px}
@keyframes tpIn{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.togi-pwa{animation:none}}
</style>


<!-- ───────── 3) <body> etiketinin hemen altına (ilk eleman olarak) ───────── -->
<div id="togiPwa" class="togi-pwa" role="region" aria-label="Uygulamayı yükle" hidden>
  <img class="tp-ico" src="icon-192.png" alt="" width="40" height="40">
  <div class="tp-txt">
    <b>TOGİ’yi Ana Ekrana Ekle</b>
    <span id="tpSub">Uygulama gibi tam ekran aç.</span>
  </div>
  <button type="button" class="tp-btn" id="tpInstall" hidden>Yükle</button>
  <button type="button" class="tp-x" id="tpClose" aria-label="Kapat">✕</button>
</div>


<!-- ───────── 4) </body> etiketinin hemen üstüne (mevcut <script>'lerden sonra) ───────── -->
<script>
(function () {
  if (window.top !== window) return;                       // iframe/önizleme içinde çalışma

  /* Service worker kaydı (yalnızca http/https üzerinde) */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js').catch(function () {});
    });
  }

  var KAPALI = 'togi_pwa_kapali', KURULU = 'togi_pwa_kurulu';
  function oku(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function yaz(k) { try { localStorage.setItem(k, '1'); } catch (e) {} }

  var bar = document.getElementById('togiPwa');
  if (!bar) return;
  var btn = document.getElementById('tpInstall');
  var sub = document.getElementById('tpSub');
  var kapat = document.getElementById('tpClose');

  function standalone() {
    var mm = window.matchMedia;
    return (mm && (mm('(display-mode: standalone)').matches ||
                   mm('(display-mode: fullscreen)').matches ||
                   mm('(display-mode: minimal-ui)').matches)) ||
           navigator.standalone === true;                  // iOS
  }
  function iosMu() {
    var ua = navigator.userAgent || '';
    return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  function goster() { bar.hidden = false; }
  function gizle() { bar.hidden = true; }

  /* Zaten kurulu / ana ekrandan açılmış / daha önce kapatılmış → hiç gösterme */
  if (standalone()) { yaz(KURULU); return; }
  if (oku(KURULU) || oku(KAPALI)) return;

  /* X: bir daha gösterme */
  kapat.addEventListener('click', function () { yaz(KAPALI); gizle(); });

  /* Android / Chrome: yüklenebilirlik olayını yakala */
  var dp = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    dp = e;
    btn.hidden = false;
    sub.textContent = 'Tek dokunuşla yükle, uygulama gibi tam ekran aç.';
    goster();
  });
  btn.addEventListener('click', function () {
    if (!dp) return;
    var ev = dp; dp = null;
    ev.prompt();                                           // telefonun kendi "Yükle" penceresi
    ev.userChoice.then(function (c) {
      if (c && c.outcome === 'accepted') yaz(KURULU);
      gizle();
    });
  });
  window.addEventListener('appinstalled', function () { yaz(KURULU); dp = null; gizle(); });

  /* iOS / Safari: olay yok, kısa yönlendirme göster */
  if (iosMu()) {
    btn.hidden = true;
    sub.innerHTML = 'Alttaki <svg class="tp-sh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M5 11v8a2 2 0 002 2h10a2 2 0 002-2v-8"/></svg> Paylaş düğmesine bas, sonra “Ana Ekrana Ekle”yi seç.';
    setTimeout(goster, 800);
  }
})();
</script>
